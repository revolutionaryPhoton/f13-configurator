version: 2
updates:
  # GUI frontend (npm).
  #
  # Two groups, both serving the same purpose: prevent the peer-dep
  # mismatch we just spent a fix-PR on (#7) from happening on a
  # different axis.
  #
  # - tauri-js: pairs @tauri-apps/* JS bumps with the cargo-side
  #   tauri-rust group below — JS/Rust runtime version match.
  #
  # - vite-build: pairs vite with the plugins/test-runners that
  #   declare it as a peer dep. Vite's major-cadence (~6mo) regularly
  #   outpaces @sveltejs/vite-plugin-svelte's, so a standalone vite
  #   bump tends to ERESOLVE at npm ci before CI even starts (see
  #   blocked PR #17, vite 6 -> 8: vite-plugin-svelte 5.x still
  #   peers at vite ^6). Bundling them means Dependabot will only
  #   propose a vite major when its peers can accept it.
  - package-ecosystem: "npm"
    directory: "/gui"
    schedule:
      interval: "weekly"
    groups:
      tauri-js:
        patterns:
          - "@tauri-apps/*"
      vite-build:
        patterns:
          - "vite"
          - "@sveltejs/vite-plugin-svelte"
          - "@tailwindcss/vite"
          - "vitest"
    ignore:
      # TypeScript 7 -- the native (Go) compiler rewrite -- is held back by
      # SvelteKit, not by us. Every 2.x release up to the current 2.70.3
      # still declares:
      #
      #     peerDependencies.typescript: "^5.3.3 || ^6.0.0"
      #
      # so a TS 7 bump ERESOLVEs at `npm ci` before CI can even start. That
      # is exactly how PR #70 (typescript 6.0.3 -> 7.0.2) failed: the macOS
      # tauri build died on "Conflicting peer dependency: typescript@6.0.3".
      #
      # Forcing it (--legacy-peer-deps or an npm override) would paper over
      # a real signal -- the Svelte toolchain has not validated TS 7.
      #
      # RECHECK PERIODICALLY: once SvelteKit widens that peer range to
      # accept ^7, delete this ignore and let the major through. Check with:
      #   npm view @sveltejs/kit peerDependencies.typescript
      #
      # Minor and patch TypeScript updates are unaffected and keep flowing.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions. Added 2026-08-31 after the runner started warning that
  # actions/checkout@v4 and gitleaks/gitleaks-action@v2 still target the
  # deprecated Node 20 action runtime. Nothing was watching this ecosystem,
  # so the pins had drifted 3-4 majors behind (checkout v4 vs v7,
  # upload-artifact v4 vs v7, download-artifact v4 vs v8, gitleaks v2 vs v3).
  #
  # NOTE: deliberately UNGROUPED, unlike the npm/cargo entries above. One PR
  # per action means each major lands with its own CI run. That matters most
  # for upload-artifact / download-artifact: their v3 -> v4 change in how
  # artifact directory structure is preserved is what broke asset collection
  # during the v0.5.0 release (see the find-based attach step in release.yml).
  # A bulk bump could re-break the release pipeline and only surface at the
  # next tag push, so keep these isolated and reviewable.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Tauri shell (cargo) — group the tauri crate + its build/plugin/runtime
  # siblings into one PR. Same scheduling as npm so the paired bumps
  # surface together.
  - package-ecosystem: "cargo"
    directory: "/gui/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      tauri-rust:
        patterns:
          - "tauri"
          - "tauri-build"
          - "tauri-plugin-*"
          - "wry"
          - "tao"
