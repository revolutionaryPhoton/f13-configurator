name: secret-scan

# Runs gitleaks against the full history of the PR (or the push) so we
# catch secrets the moment they're proposed. Pairs with the local
# pre-commit hook in .pre-commit-config.yaml.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
