name: Release

# Tag-push (v*) builds a signed + notarized .dmg (macOS arm64) and
# attaches it to a DRAFT GitHub Release. The maintainer reviews the
# artifact, edits the notes, and publishes the draft manually — no
# auto-publish, matching the manual-publish convention used since v0.3.x.
#
# NOTE: Linux .AppImage/.deb targets are DEFERRED to v0.5.1. The
# build-linux job below is disabled (`if: false`); see its comment for
# the glibc reason and the re-enable plan.
#
# workflow_dispatch is allowed for build-only dry runs: it builds and
# signs/notarizes but does NOT create a Release (the draft-release job
# is gated on a real tag ref).
#
# Required repo secrets (set 2026-05-31):
#   MACOS_CERTIFICATE      base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PWD  the .p12 export password
#   APPLE_ID               Apple ID email
#   APPLE_PASSWORD         app-specific password (NOT the account pw)
#   APPLE_TEAM_ID          Apple Team ID (6DDFRR6F7B)
# GITHUB_TOKEN is provided automatically.
#
# The signing identity itself lives in gui/src-tauri/tauri.conf.json
# (bundle.macOS.signingIdentity) — not secret; it is embedded in every
# notarized artifact anyway.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # draft-release job creates a GitHub Release

jobs:
  build-macos:
    name: Build .dmg (macOS arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Cache Rust deps + target/
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui/src-tauri -> target"

      # Keep bundle version in sync with the release tag so the .dmg
      # filename + Info.plist CFBundleVersion match v0.5.0 instead of
      # tauri.conf.json's static 0.1.0. Tag-only; skipped on dispatch.
      - name: Sync bundle version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: gui/src-tauri
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
          echo "Set bundle version to $VERSION"

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build, sign, and notarize .dmg
        working-directory: gui
        env:
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg

      # Tauri notarizes + staples the .app inside the bundle during the
      # build above. Staple the .dmg wrapper too, so a downloaded dmg
      # opens cleanly offline (Gatekeeper reads the staple instead of
      # doing an online check). Notarizing the dmg is a second, faster
      # round-trip — the contents are already known to Apple.
      - name: Notarize and staple the .dmg
        working-directory: gui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(ls *.dmg | head -1)
          echo "Notarizing $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Upload .dmg artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: gui/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # DISABLED for v0.5.0 — Linux targets deferred to v0.5.1.
  #
  # The ubuntu-latest runner builds against a newer glibc than older
  # target distros (e.g. WSL2 Ubuntu 22.04) ship, so the binary aborts
  # with `GLIBC_x.xx not found` there. v0.5.1 fix: build on the
  # ubuntu-22.04 runner (older glibc → broader forward-compat), then
  # re-enable by removing `if: false` here AND re-adding `build-linux`
  # to the draft-release `needs:` list. The find-based attach step
  # already handles whatever artifacts are present.
  build-linux:
    name: Build .AppImage + .deb (Linux x86_64)
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps + target/
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "gui/src-tauri -> target"

      - name: Install Tauri Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            wget

      - name: Sync bundle version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: gui/src-tauri
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tauri.conf.json.tmp
          mv tauri.conf.json.tmp tauri.conf.json
          echo "Set bundle version to $VERSION"

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Build .AppImage + .deb
        working-directory: gui
        run: npm run tauri build -- --bundles appimage,deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundles
          path: |
            gui/src-tauri/target/release/bundle/appimage/*.AppImage
            gui/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  draft-release:
    name: Create draft Release
    needs: [build-macos] # build-linux deferred to v0.5.1 (see above)
    runs-on: ubuntu-latest
    # Only on a real tag push — dispatch dry runs build but don't publish.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create draft Release with artifacts attached
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect by NAME at any depth -- do not "simplify" this to a
          # fixed glob. The layout download-artifact produces has changed
          # across major versions, in BOTH directions, and each time it
          # changed silently:
          #   v4: nested per artifact  -> artifacts/macos-dmg/*.dmg
          #   v8: flat                 -> artifacts/*.dmg
          # A fixed glob broke asset collection at v0.5.0 (assumed flat,
          # got nested); the v8 bump then flipped it back (verified via a
          # throwaway v0.5.5-rc1 tag). This find survives both. Nothing in
          # CI exercises this step -- no job runs release.yml -- so a
          # regression here only surfaces at a real tag push. If you change
          # the artifact actions, validate with a throwaway rc tag.
          # (Currently only the macOS .dmg is produced; the name list still
          # matches Linux artifacts for when build-linux is re-enabled.)
          mapfile -t FILES < <(find artifacts -type f \
            \( -name '*.dmg' -o -name '*.AppImage' -o -name '*.deb' \) | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::error::no release artifacts found under artifacts/"
            exit 1
          fi
          echo "Attaching ${#FILES[@]} artifact(s):"
          printf '  %s\n' "${FILES[@]}"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated draft for ${GITHUB_REF_NAME}. Review the attached artifact(s), replace these notes with the CHANGELOG section, then publish manually." \
            "${FILES[@]}"
