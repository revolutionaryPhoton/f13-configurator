name: CI

# Two parallel jobs covering the ralph loop's backpressure suite:
#   - tauri build --debug (macOS): GUI build + svelte-check + vitest + cargo
#   - shellcheck + bats (Linux):   shell wizard suite (much faster on Linux,
#                                  no Tauri/Xcode toolchain needed)
# Does NOT publish or upload any artifacts — that is Phase 10's job.

on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - "bin/**"
      - "lib/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "gui/**"
      - "bin/**"
      - "lib/**"
      - "templates/**"
      - "tests/**"
      - ".github/workflows/**"

jobs:
  build-macos:
    name: tauri build --debug (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: gui/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Add Apple Silicon target
        run: rustup target add aarch64-apple-darwin

      - name: Install frontend dependencies
        working-directory: gui
        run: npm ci

      - name: Run headless checks
        working-directory: gui
        run: npm run check && npm run test:unit && cargo check --manifest-path src-tauri/Cargo.toml

      - name: tauri build --debug
        working-directory: gui
        run: npm run tauri build -- --debug

  shell-checks:
    name: shellcheck + bats (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck and bats
        run: sudo apt-get update && sudo apt-get install -y shellcheck bats

      - name: shellcheck -S warning bin/* lib/*.sh
        run: shellcheck -S warning bin/* lib/*.sh

      - name: bats tests/
        run: bats tests/
